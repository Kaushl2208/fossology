name: Docker images - master

concurrency:
  group: docker-${{ github.head_ref }}
  cancel-in-progress: true

on:
  push:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set build version
      run: |
        VERSION_PATTERN='([[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+)(-?rc[[:digit:]]+)?-?([[:digit:]]*)-?[[:alnum:]]*'
        echo VERSION=$(git describe --tags > /dev/null 2>&1 && git describe --tags | head -1 | sed -re "s/${VERSION_PATTERN}/\\1.\\3\\2/" | sed -re 's/\.$/.0/') >> $GITHUB_ENV
        echo OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]') >> $GITHUB_ENV
    - name: Build and push main image
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: ghcr.io/${{ env.OWNER }}/fossology:latest
        context: .
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.version=${VERSION}

    - name: Build and push runner image
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: ghcr.io/${{ env.OWNER }}/fossology:scanner
        file: utils/automation/Dockerfile.ci
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.version=${VERSION}
